:root{
  --bg:#eef4f2;--card:#fff;--fg:#14302b;--muted:#5d726e;--line:#d3dfdc;
  --accent:#00796b;--accent-fg:#fff;--soft:#e3f2ef;--key:#e9efee;--key-hi:#dfe7e5;
  --ok:#1e8e3e;--warn:#c77700;--bad:#c62828;--sel:#fff6d6;--sel-line:#e0a800;
  --f:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1917;--card:#172321;--fg:#e2efec;--muted:#98b1ac;--line:#2b3d3a;--accent:#3fbfae;--accent-fg:#05201c;--soft:#1d3330;--key:#22322f;--key-hi:#2b3f3b;--sel:#3a3217;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1917;--card:#172321;--fg:#e2efec;--muted:#98b1ac;--line:#2b3d3a;--accent:#3fbfae;--accent-fg:#05201c;--soft:#1d3330;--key:#22322f;--key-hi:#2b3f3b;--sel:#3a3217;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);direction:rtl}
body{min-height:100vh}
button,input,select,textarea{font-family:inherit}
[hidden]{display:none!important}
.netbadge{position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--warn);color:#fff;font-weight:700;font-size:.9rem;text-align:center;padding:8px 12px;border-radius:12px;max-width:560px;margin:0 auto}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.wide{max-width:1150px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.btn{font:700 1rem var(--f);padding:11px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:9px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.pad button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.err{color:var(--bad);font-weight:700;min-height:1.4em;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.inp{font:700 1rem var(--f);padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);width:100%}
.inp.n{width:72px;text-align:center}
select.inp{width:auto}
h1,h2,h3{margin:0}

/* ===== الدخول ===== */
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin:6px 0 14px}
.brand img{width:120px;height:auto}
.brand h1{font-size:1.5rem;font-weight:800}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>label{font-weight:800}
.display{font:800 1.9rem var(--f);letter-spacing:.12em;text-align:center;padding:10px;border:2px solid var(--accent);border-radius:12px;min-height:62px;direction:ltr;background:var(--soft)}
.display .ph{color:var(--muted);font-size:1.05rem;letter-spacing:0;font-weight:500;direction:rtl}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg);font-weight:800;font-size:1.05rem;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.big-sel{font:700 1.05rem var(--f);width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg)}
.tlink{display:block;margin:18px auto 0;background:none;border:0;color:var(--muted);opacity:.7;cursor:pointer;font-size:.85rem}

/* ===== لوحة الأرقام بتنسيق الجوال ===== */
.pad{direction:ltr;display:grid;grid-template-columns:repeat(3,72px);gap:12px 24px;justify-content:center;margin:4px 0 14px}
.pad button{width:72px;height:72px;border-radius:50%;border:0;background:var(--key);color:var(--fg);font:700 2.1rem var(--f);cursor:pointer;touch-action:manipulation;display:grid;place-items:center;transition:background .1s}
.pad button:active{background:var(--key-hi);transform:scale(.95)}
.pad .fn{background:transparent;font-size:.95rem;font-weight:700;color:var(--muted)}
.pad .fn svg{width:30px;height:30px}
.pad .go{background:var(--accent);color:var(--accent-fg);font-size:1rem}
.dock .pad{grid-template-columns:repeat(3,58px);gap:8px 26px;margin:0}
.dock .pad button{width:58px;height:58px;font-size:1.75rem}
.dock .pad .go{font-size:.9rem}

/* ===== أعمالي ===== */
.hello{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.hello b{font-size:1.15rem}
.wlist{display:grid;gap:10px}
.witem{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.witem h3{font-size:1.08rem}
.witem .meta{font-size:.85rem;margin-top:4px}
.tbadge{display:inline-block;font-size:.78rem;font-weight:800;padding:2px 9px;border-radius:99px;margin-inline-end:6px;vertical-align:2px}
.t-exam{background:#fde8e8;color:#b42318}.t-hw{background:#e6efff;color:#1d4ed8}.t-cls{background:#e8f6ec;color:#1e7a3a}.t-fin{background:#f3e8ff;color:#6b21a8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-exam{background:#3a1d1d;color:#ffb4ab}:root:not([data-theme="light"]) .t-hw{background:#1c2a44;color:#a9c3ff}:root:not([data-theme="light"]) .t-cls{background:#183223;color:#9fe0b4}}

/* ===== الاختبار ===== */
.topbar{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.topbar .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.who b{display:block;font-size:1rem}
.who span{font-size:.82rem}
.timer{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.7rem;padding:6px 14px;border-radius:12px;background:var(--soft);color:var(--accent);white-space:nowrap}
.timer.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--card))}
.timer.end{color:#fff;background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.75}}
.timer svg{width:24px;height:24px}
.prog{height:6px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.sec{margin:16px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec h2{font-size:1.2rem;font-weight:800}
.pill{font-size:.85rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--accent);white-space:nowrap}
.ins{margin:-2px 0 10px;font-weight:700;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid.g1{grid-template-columns:1fr}
@media (min-width:600px){.grid.g4{grid-template-columns:repeat(4,1fr)}.grid.g3{grid-template-columns:repeat(3,1fr)}}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px 8px 14px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.q .n{position:absolute;top:7px;right:9px;font-size:.8rem;font-weight:800;color:var(--muted);border:1px solid var(--line);border-radius:7px;min-width:24px;height:22px;display:grid;place-items:center}
.q.done{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.eq{display:flex;align-items:center;gap:8px;font-weight:800;font-size:2rem;line-height:1}
.ltr{direction:ltr;unicode-bidi:isolate}
.box{min-width:56px;height:52px;border:2.5px solid var(--fg);border-radius:10px;background:var(--card);font:800 1.8rem var(--f);color:var(--accent);display:inline-grid;place-items:center;cursor:pointer;padding:0 6px}
.box.on{border-color:var(--sel-line);background:var(--sel);box-shadow:0 0 0 3px color-mix(in srgb,var(--sel-line) 35%,transparent)}
.cmpbtns{display:flex;gap:6px}
.cmpbtns button{width:46px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--soft);color:var(--fg);font:800 1.4rem var(--f);cursor:pointer}
.cmpbtns button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.stem{font-weight:800;font-size:1.12rem;text-align:center;line-height:1.7;padding-inline:6px}
.stem em{font-style:normal;font-size:1.5rem;color:var(--accent);padding-inline:3px}
.pvrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-weight:800;font-size:1.1rem}
.pvrow span{display:flex;align-items:center;gap:6px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%;max-width:420px}
.opts button{padding:12px 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);color:var(--fg);font:800 1.2rem var(--f);cursor:pointer}
.opts button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.dock{position:sticky;bottom:0;z-index:9;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom))}
.dock .hint{text-align:center;font-size:.82rem;margin-bottom:6px}
.submitbar{display:flex;justify-content:center;margin:22px 0 10px}

/* ===== النتيجة ===== */
.result{text-align:center;display:grid;gap:10px;justify-items:center;margin-top:30px}
.result .big{font-size:3.4rem;font-weight:900;color:var(--accent)}
.stars{font-size:2.2rem;letter-spacing:4px;color:#f5b301}

/* ===== المعلم ===== */
.tnav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tnav button{font:800 .95rem var(--f);padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.tnav button[aria-current="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:12px}
.tgrid .card{display:grid;gap:8px;align-content:start}
.tgrid h3{font-size:1rem}
.stat{display:flex;gap:8px;flex-wrap:wrap}
.stat span{background:var(--soft);border-radius:10px;padding:6px 10px;font-weight:700;font-size:.9rem}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center;vertical-align:middle}
.tbl th{background:var(--soft);font-weight:800;position:sticky;top:0;z-index:1}
.tbl td.nm{font-weight:700}
.scroll{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-weight:700;font-size:.8rem;white-space:nowrap}
.b-no{background:var(--soft);color:var(--muted)}
.b-run{background:color-mix(in srgb,var(--warn) 18%,var(--card));color:var(--warn)}
.b-ok{background:color-mix(in srgb,var(--ok) 16%,var(--card));color:var(--ok)}
.b-bad{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}
.acts{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;align-items:center}
.acts .inp{width:60px;padding:5px;font-size:.9rem;text-align:center}
.headrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
/* محرر الأسئلة */
.qed{display:grid;gap:8px}
.qrow{display:grid;grid-template-columns:34px 120px 1fr auto;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.qrow .no{font-weight:800;text-align:center;color:var(--muted)}
.qrow .ty{font-weight:800;font-size:.9rem}
.qrow .fs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-weight:700;font-size:.9rem}
.qrow .fs .inp{padding:6px 8px;font-size:.95rem}
.qrow .fs .inp.n{width:62px}
.qrow .fs .inp.t{flex:1;min-width:180px}
@media (max-width:700px){.qrow{grid-template-columns:30px 1fr auto}.qrow .fs{grid-column:1/-1}}
.addbar{display:flex;gap:6px;flex-wrap:wrap}
.tfo{grid-template-columns:1fr 1fr}
.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:10px}
.ctile{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center;text-align:right;min-height:66px;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
.ctile .no{grid-row:1/3;font-weight:800;color:var(--muted);min-width:22px;text-align:center}
.ctile .tn{font-weight:800;font-size:.95rem;line-height:1.4}
.ctile .st{font-size:.82rem;color:var(--muted);font-weight:700}
.ctile.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}.ctile.ok .st{color:var(--ok)}
.ctile.run .st{color:var(--warn)}
.ctile:hover{border-color:var(--accent)}
.clsbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:6px 16px;background:var(--sel);border-top:1px solid var(--sel-line);font-weight:700;font-size:.95rem}

.wtype{display:inline-block;font-size:.95rem;font-weight:900;border-radius:99px;padding:3px 14px;margin-bottom:4px;border:1.5px solid currentColor}
.cw{color:var(--ct);font-weight:900;background:color-mix(in srgb,var(--cw) 14%,transparent);border-radius:8px;padding:0 6px;box-shadow:inset 0 -3px 0 var(--cw)}
.ballico{width:1.05em;height:1.05em;vertical-align:-.15em;margin-inline:3px}
.bag{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:flex-end;max-width:260px;min-height:70px;padding:16px 18px 14px;border:3px solid #a1887f;border-top-width:6px;border-radius:12px 12px 40px 40px;background:color-mix(in srgb,#a1887f 12%,var(--card))}
.ball{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.75) 0 18%,transparent 20%),var(--b);border:1.5px solid rgba(0,0,0,.25)}

.fillrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:1.6rem;line-height:1.9}
.opool,.oseq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px;align-items:center;width:100%}
.oseq{border:2px dashed var(--line);border-radius:12px;padding:8px}
.chip{min-width:58px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--soft);color:var(--fg);font:800 1.3rem var(--f);cursor:pointer;padding:0 12px}
.chip.used{opacity:.3;pointer-events:none}
.oseq .chip{border-color:var(--accent)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 26px;width:100%;max-width:460px}
.mgrid>div{display:flex;flex-direction:column;gap:8px}
.mi{min-height:50px;border-radius:12px;border:2px solid var(--line);background:var(--soft);color:var(--fg);font:800 1.15rem var(--f);cursor:pointer;padding:6px}
.mi.on{border-color:var(--sel-line);background:var(--sel)}
.chart{width:100%;max-width:520px;height:auto;color:var(--fg)}
.ptbl{border-collapse:separate;border-spacing:0;width:100%;max-width:480px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;font-weight:800}
.ptbl th{background:var(--accent);color:var(--accent-fg);padding:8px 10px;font-size:1rem}
.ptbl td{border-top:1px solid var(--line);padding:6px 10px;vertical-align:middle}
.ptbl tbody tr:nth-child(even) td{background:var(--soft)}
.ptbl td:first-child{border-inline-end:1px solid var(--line);white-space:nowrap;width:1%}
.ptbl .pn{display:inline-flex;align-items:center;gap:6px;font-size:1.05rem}
.ptbl td.ic{font-size:1.75rem;line-height:1.3;display:flex;flex-wrap:wrap;gap:4px}
.pi{font-size:1.25rem;line-height:1}
.pkey{font-weight:700;font-size:.9rem;color:var(--muted);background:var(--soft);border-radius:99px;padding:4px 14px}
.pkey b{color:var(--accent)}
.dtbl .rh{background:var(--accent);color:var(--accent-fg)}
.dtbl th .pi{display:block;font-size:1.5rem;margin-bottom:2px}
.datebar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:6px 12px 8px}
.datebar.home{justify-content:flex-start;padding:0 0 12px}
.dpill{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:6px 14px;font-weight:800;font-size:.98rem;color:#fff;background:linear-gradient(135deg,#00796b,#0e9f8c);box-shadow:0 2px 8px rgba(0,121,107,.25)}
.dpill.alt{background:linear-gradient(135deg,#c77700,#e8a33a);box-shadow:0 2px 8px rgba(199,119,0,.25)}
.dpill svg{width:18px;height:18px;flex:none}
.dtbl{border-collapse:collapse;font-weight:800}
.dtbl th,.dtbl td{border:1px solid var(--line);padding:6px 14px;text-align:center}
.dtbl th{background:var(--soft)}
.build{display:flex;gap:14px;justify-content:center;align-items:flex-end}
.bcol{display:flex;flex-direction:column;align-items:center;gap:4px}
.cells{display:flex;flex-direction:column-reverse;gap:3px}
.cell{width:44px;height:24px;border-radius:5px;border:1.5px solid var(--line);background:transparent;cursor:pointer;padding:0}
.cell.f{background:var(--accent);border-color:var(--accent)}
.blab{font-weight:800}
.tally{display:inline-flex;gap:12px;align-items:center;min-height:40px;flex-wrap:wrap;justify-content:center}
.tg{position:relative;display:inline-flex;gap:5px;height:34px}
.tg i{width:4px;background:var(--fg);border-radius:2px;display:block}
.tg .x{position:absolute;inset-inline:-5px;top:50%;height:4px;background:var(--fg);transform:rotate(-28deg);border-radius:2px}
.tctl{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.tctl>button{width:50px;height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);color:var(--fg);font:800 1.6rem var(--f);cursor:pointer}
.pairf{display:inline-flex;gap:4px;align-items:center}
@media (max-width:420px){.cell{width:36px}.mgrid{gap:8px 12px}}

.chk{display:flex;gap:6px;align-items:center;font-weight:700;font-size:.95rem}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{max-width:400px;width:100%;text-align:center;display:grid;gap:12px}
.modal .row{justify-content:center}

/* ===== الكشوف للطباعة ===== */
.sheets{display:grid;gap:18px;justify-items:center;margin-top:12px}
.zoomer{width:100%;max-width:794px}
.sheet{width:210mm;min-height:297mm;background:#fff;color:#111;padding:8mm 10mm;box-shadow:0 2px 12px rgba(0,0,0,.18);font-family:var(--f);display:flex;flex-direction:column;gap:3mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .hdr{display:grid;grid-template-columns:1.2fr 24mm 1fr;align-items:center;gap:3mm;padding-bottom:2.5mm;border-bottom:2px solid #222}
.sheet .hdr div{text-align:center;font-weight:800;font-size:10pt;line-height:1.45}
.sheet .hdr img{width:100%}
.sheet .ttl{text-align:center;font-size:14pt;font-weight:900}
.sheet .info{display:flex;justify-content:center;gap:8mm;font-weight:700;font-size:11.5pt;flex-wrap:wrap}
.sheet table{width:100%;border-collapse:collapse;font-size:10.5pt}
.sheet th,.sheet td{border:1px solid #333;padding:.55mm 1.5mm;text-align:center;vertical-align:middle}
.sheet th{background:#e6e6e6;font-weight:800}
.sheet td.nm{font-weight:700}
.sheet .sum{display:flex;justify-content:space-around;border:1.5px solid #333;border-radius:2mm;padding:2mm;font-weight:800;font-size:11pt}
.sheet .sig{display:flex;justify-content:space-between;margin-top:auto;padding:2mm 6mm 0;font-weight:800;font-size:11pt;line-height:2}
.sheet.land{width:297mm;min-height:210mm}
.sheet .gx th,.sheet .gx td{font-size:9pt;padding:.3mm .8mm}
.sheet.land{padding:6mm 10mm;gap:2mm}.sheet.land .hdr{grid-template-columns:1.2fr 18mm 1fr;padding-bottom:1.5mm}.sheet.land .hdr div{font-size:8.5pt;line-height:1.35}.sheet.land .ttl{font-size:12pt}
.sheet .gx td{font-size:8.5pt;padding:0 .8mm;line-height:1.45}.sheet.land .sig{font-size:10pt;line-height:1.7;padding-top:1mm}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  .sheet{box-shadow:none;break-after:page;margin:0;zoom:1!important;height:auto;min-height:0}
  .sheet:not(.land){height:296mm}.sheet.land{width:297mm;height:208mm;overflow:hidden}
  .zoomer{max-width:none}
  .sheet:last-child{break-after:auto}
}
#printArea{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ================= الأسئلة: الإجابة والتصحيح ================= */
function keyOf(q){switch(q.t){case"add":return String(q.a+q.b);case"sub":return String(q.a-q.b);
  case"cmp":return q.b<q.a?"<":q.b>q.a?">":"=";case"pv":return[String(Math.floor(q.n/10)),String(q.n%10)];
  case"mk":return String(q.tn*10+q.on);case"num":return String(EN(q.ans)).trim();case"mcq":return String(q.c)}}
/* ===== تصحيح أنواع الأسئلة الجديدة (مشترك بين المنصة والكشف) ===== */
const QX=(()=>{
  const E=s=>String(s??"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).trim();
  const blanks=q=>[...String(q.text||"").matchAll(/\[([^\]]+)\]/g)].map(m=>E(m[1]));
  const isN=x=>/^-?\d+(\.\d+)?$/.test(E(x));
  const orderKey=q=>{const it=(q.items||[]).map(x=>E(x));if(q.dir==="as")return it;const allN=it.every(isN);
    const s=it.slice().sort((a,b)=>allN?(+a)-(+b):a.localeCompare(b,"ar"));return q.dir==="desc"?s.reverse():s};
  const NEW=["tf","fill","order","match","chart","make","tally"];
  function right(q,i,a){a=a||{};switch(q.t){
    case"tf":return a[i]===(q.ans?"t":"f");
    case"fill":{const b=blanks(q);return b.length>0&&b.every((x,j)=>E(a[i+"_"+j])===x)}
    case"order":return String(a[i]||"")===orderKey(q).join("|");
    case"match":{const m=String(a[i]||"").split("|");return (q.pairs||[]).length>0&&(q.pairs||[]).every((p,j)=>m.includes(j+">"+j))}
    case"chart":return (q.opts||[]).length?a[i]===String(q.c):(a[i]!==undefined&&a[i]!==""&&E(a[i])===E(q.ans));
    case"make":return String(a[i]||"")===(q.vals||[]).join("|");
    case"tally":return E(a[i])===String(q.n);
    default:return null}}
  function answered(q,i,a){a=a||{};switch(q.t){
    case"fill":return blanks(q).every((x,j)=>a[i+"_"+j]);
    case"order":return String(a[i]||"").split("|").filter(Boolean).length===(q.items||[]).length;
    case"match":return String(a[i]||"").split("|").filter(Boolean).length===(q.pairs||[]).length;
    case"make":return String(a[i]||"").split("|").some(x=>+x>0);
    case"tally":return a[i]!==undefined&&a[i]!==""&&a[i]!=="0";
    default:return a[i]!==undefined&&a[i]!==""}}
  return{right,answered,blanks,orderKey,E,isN,NEW}})();

function isRight(q,i,a){const x=QX.right(q,i,a);if(x!==null)return x;const k=keyOf(q);return q.t==="pv"?(a[i+"a"]===k[0]&&a[i+"b"]===k[1]):String(a[i]??"")===k}
function isAnswered(q,i,a){if(QX.NEW.includes(q.t))return QX.answered(q,i,a);return q.t==="pv"?!!(a[i+"a"]&&a[i+"b"]):a[i]!==undefined&&a[i]!==""}
const scoreOf=(w,a)=>w.questions.reduce((s,q,i)=>s+(isRight(q,i,a||{})?1:0),0);
const grp=t=>t==="pv"||t==="mk"?"pvmk":t;
const GRP={add:["الجمع","أوجد ناتج الجمع :","g4"],sub:["الطرح","أوجد ناتج الطرح :","g4"],cmp:["أكبر من وأصغر من ويساوي","اختر العلامة المناسبة ( > ، < ، = ) :","g3"],
  pvmk:["الآحاد والعشرات","أكمل ما يلي :",""],num:["حل المسائل","اكتب الإجابة في المربع :","g1"],mcq:["اختر الإجابة الصحيحة","اضغط على الإجابة الصحيحة :","g1"],
  tf:["صح أم خطأ","اضغط «صح» أو «خطأ» :","g1"],fill:["أكمل الفراغ","اكتب العدد المناسب في المربع :","g1"],order:["الترتيب","اضغط العناصر بالترتيب المطلوب :","g1"],
  match:["التوصيل","اضغط عنصرًا من اليمين ثم ما يقابله من اليسار :","g1"],chart:["قراءة البيانات","اقرأ التمثيل ثم أجب :","g1"],make:["تمثيل البيانات","اضغط المربعات لتلوين ارتفاع كل عمود :","g1"],tally:["جدول الإشارات","أجب عمّا يلي :","g1"]};
function groups(w){const g=[];w.questions.forEach((q,i)=>{const k=grp(q.t);if(!g.length||g[g.length-1].k!==k)g.push({k,items:[]});g[g.length-1].items.push(i)});return g}

  const v=await ask("دخول المعلم",`<input class="inp" id="tu" inputmode="numeric" placeholder="اسم المستخدم" autocomplete="off" style="text-align:center"><input class="inp" id="tp" type="password" inputmode="numeric" placeholder="كلمة المرور" style="text-align:center">`);
  if(!v)return;DB=load();
  const cand={tu:H("t:u:",EN(v[0]).trim()),tp:H("t:p:",EN(v[1]).trim())};
  const localWorks=JSON.parse(JSON.stringify(DB.works||[])),localRec=JSON.parse(JSON.stringify(DB.rec||{})),localIds=Object.assign({},DB.ids||{});
  let d;try{d=await rpc("mw_teacher_load",{p_tu:cand.tu,p_tp:cand.tp})}catch(e){return toast(e.auth?"بيانات الدخول غير صحيحة":"تعذّر الاتصال بالإنترنت")}
  TC=cand;DB.settings.tu=cand.tu;DB.settings.tp=cand.tp;DB.session=null;DB.sh=null;Sync.tlast=null;Sync.applyTeacher(d);

    Object.keys(Sync.tlast.rec).forEach(x=>delete Sync.tlast.rec[x]);save();await Sync.push();toast("تم رفع الأعمال")}

};

/* ---------- حل في الصف: المعلم يختار الطالب فيحل على جهاز المعلم بدون رقم سري ---------- */
let clsW=null,clsSec="1",classMode=null;
function drawClass(){DB=load();const w=work(clsW);if(!w)return openTeacher("works");const R=DB.rec[w.id]||{};
  if(!w.sections.includes(clsSec))clsSec=w.sections[0];
  const L=bySec(clsSec),done=L.filter(s=>{const r=R[s.k]||{};return r.submitted||expired(w,r)}).length;
  $("tView").innerHTML=`<div class="headrow"><h2 style="font-size:1.15rem"><span class="tbadge t-${w.type}">${TYPES[w.type]}</span>${esc(w.title)} — حل في الصف</h2><button class="btn" data-back type="button">رجوع</button></div>
    <div class="card" style="display:grid;gap:10px"><div class="muted">اختر اسم الطالب، فيظهر له العمل مباشرة على هذا الجهاز بدون رقم سري، وتُرصد درجته تلقائيًا باسمه.</div>
      <div class="row">${w.sections.length>1?`<div class="seg" style="min-width:220px">${w.sections.map(x=>`<button type="button" data-csec="${x}" aria-pressed="${x===clsSec}">${secName(x)}</button>`).join("")}</div>`:`<b>${secName(clsSec)}</b>`}
        <span class="badge b-ok">حلّ ${AD(done)} من ${AD(L.length)}</span></div></div>
    <div class="ctiles">${L.map((s,i)=>{const r=R[s.k]||{},ok=r.submitted||expired(w,r),sc=r.submitted?r.score:ok?scoreOf(w,r.ans):null;
      return `<button type="button" class="ctile${ok?" ok":r.start?" run":""}" data-pick="${s.k}"><span class="no">${AD(i+1)}</span><span class="tn">${esc(s.n)}</span><span class="st">${ok?`✓ ${AD(sc)} من ${AD(w.questions.length)}`:r.start?"لم يكمل":"لم يحل"}</span></button>`}).join("")}</div>`}
async function startClass(k){const w=work(clsW),r=(DB.rec[w.id]||{})[k]||{};
  if(r.submitted||expired(w,r)){if(!await ask(`<b>${esc(stu(k).n)}</b> حلّ هذا العمل وحصل على ${AD(r.submitted?r.score:scoreOf(w,r.ans))} من ${AD(w.questions.length)}.<br>إعادة الحل له؟ ستُحذف إجابته السابقة.`))return;
    DB=load();["start","ans","submitted","score","timeUp"].forEach(x=>delete recOf(w.id,k)[x]);save()}
  classMode={wid:w.id};DB=load();DB.session=k;startWork(w.id);$("clsBar").hidden=false;$("clsName").textContent=stu(k).n}
function endClass(){classMode=null;DB=load();DB.session=null;DB.cur=null;cur=null;clearInterval(tick);save();$("clsBar").hidden=true;openTeacher("cls")}

function stats(w){const R=DB.rec[w.id]||{};const ks=STU.filter(s=>w.sections.includes(s.s));
  let ok=0,run=0;ks.forEach(s=>{const r=R[s.k]||{};if(r.submitted||expired(w,r))ok++;else if(r.start)run++});return {n:ks.length,ok,run}}

const dataTxt=q=>(q.cats||[]).map((c,j)=>c+"="+AD(q.vals[j]??"")).join("، ");
function parseData(t){const cats=[],vals=[];String(t).split(/[،,\n]/).forEach(x=>{const m=x.split("=");if(m.length===2&&m[0].trim()){cats.push(m[0].trim());vals.push(parseInt(EN(m[1]).trim(),10)||0)}});return{cats,vals}}
function qFields(q,i){
  const n=(f,v,lab)=>`${lab?`<span>${lab}</span>`:""}<input class="inp n" data-i="${i}" data-f="${f}" value="${AD(v??"")}" inputmode="numeric">`;
  switch(q.t){
    case"add":return n("a",q.a)+"<span>+</span>"+n("b",q.b)+`<span class="muted">= ${AD(q.a+q.b)}</span>`;
    case"sub":return n("a",q.a)+"<span>−</span>"+n("b",q.b)+`<span class="muted">= ${AD(q.a-q.b)}</span>`;
    case"cmp":return n("a",q.a,"العدد الأيمن")+n("b",q.b,"العدد الأيسر")+`<span class="muted ltr">${AD(q.b)} ${esc(keyOf(q))} ${AD(q.a)}</span>`;
    case"pv":return n("n",q.n,"العدد");
    case"mk":return n("tn",q.tn,"عشرات")+n("on",q.on,"آحاد")+`<span class="muted">= ${AD(q.tn*10+q.on)}</span>`;
    case"num":return `<input class="inp t" data-i="${i}" data-f="text" value="${esc(q.text)}" placeholder="نص السؤال">`+n("ans",q.ans,"الإجابة");
    case"tf":return `<input class="inp t" data-i="${i}" data-f="text" value="${esc(q.text)}" placeholder="نص العبارة">`+[["t","صح"],["f","خطأ"]].map(([v,l])=>`<label class="chk" style="font-size:.85rem"><input type="radio" name="tf${i}" data-i="${i}" data-f="tf" value="${v}" ${(q.ans?"t":"f")===v?"checked":""}> ${l}</label>`).join("");
    case"fill":return `<input class="inp t" data-i="${i}" data-f="text" value="${esc(q.text)}" placeholder="مثال: ٣٠ + [٢٠] = ٥٠"><span class="muted" style="font-size:.8rem">ضع الإجابة بين قوسين [ ] — كل قوسين مربع</span>`;
    case"order":return `<input class="inp t" data-i="${i}" data-f="items" value="${esc((q.items||[]).join("، "))}" placeholder="العناصر مفصولة بفاصلة"><select class="inp" data-i="${i}" data-f="dir"><option value="asc" ${q.dir==="asc"?"selected":""}>من الأصغر إلى الأكبر</option><option value="desc" ${q.dir==="desc"?"selected":""}>من الأكبر إلى الأصغر</option><option value="as" ${q.dir==="as"?"selected":""}>كما كتبتها (الترتيب الصحيح)</option></select><input class="inp t" data-i="${i}" data-f="text" value="${esc(q.text||"")}" placeholder="نص إضافي (اختياري)">`;
    case"match":return `<input class="inp t" data-i="${i}" data-f="text" value="${esc(q.text||"")}" placeholder="نص السؤال (اختياري)">`+(q.pairs||[]).map((p,j)=>`<span class="pairf"><input class="inp" style="width:110px" data-i="${i}" data-f="pl${j}" value="${esc(p[0])}" placeholder="يمين"><span>←</span><input class="inp" style="width:110px" data-i="${i}" data-f="pr${j}" value="${esc(p[1])}" placeholder="يسار"><button class="btn sm" data-qpr="${i}" data-j="${j}" type="button" aria-label="حذف الزوج">×</button></span>`).join("")+`<button class="btn sm" data-qp="${i}" type="button">+ زوج</button>`;
    case"chart":return `<select class="inp" data-i="${i}" data-f="kind"><option value="bar" ${q.kind!=="picto"?"selected":""}>تمثيل بالأعمدة</option><option value="picto" ${q.kind==="picto"?"selected":""}>تمثيل بالصور</option></select>`
      +(q.kind==="picto"?`<input class="inp" style="width:64px" data-i="${i}" data-f="icon" value="${esc(q.icon||"⭐")}" aria-label="الصورة"><span>كل صورة =</span>${n("unit",q.unit||1)}`:"")
      +`<input class="inp t" data-i="${i}" data-f="title" value="${esc(q.title||"")}" placeholder="عنوان التمثيل"><input class="inp t" data-i="${i}" data-f="data" value="${esc(dataTxt(q))}" placeholder="البيانات: تفاح=٦، موز=٣، عنب=٢">`
      +`<input class="inp t" data-i="${i}" data-f="ask" value="${esc(q.ask||"")}" placeholder="السؤال: كم طالبًا يفضل التفاح؟"><input class="inp t" data-i="${i}" data-f="optsT" value="${esc((q.opts||[]).join("، "))}" placeholder="خيارات (اختياري) مفصولة بفاصلة">`
      +((q.opts||[]).length?`<input class="inp" style="width:120px" data-i="${i}" data-f="ansO" value="${esc(q.opts[q.c]??"")}" placeholder="الخيار الصحيح">`:n("ans",q.ans,"الإجابة"));
    case"make":return `<input class="inp t" data-i="${i}" data-f="title" value="${esc(q.title||"")}" placeholder="مثّل البيانات بالأعمدة"><input class="inp t" data-i="${i}" data-f="data" value="${esc(dataTxt(q))}" placeholder="البيانات: أحمر=٣، أزرق=٥"><span>أعلى ارتفاع</span>${n("max",q.max||6)}`;
    case"tally":return `<select class="inp" data-i="${i}" data-f="mode"><option value="read" ${q.mode!=="draw"?"selected":""}>يقرأ الإشارات ويكتب العدد</option><option value="draw" ${q.mode==="draw"?"selected":""}>يرسم إشارات للعدد</option></select>${n("n",q.n,"العدد")}<input class="inp t" data-i="${i}" data-f="text" value="${esc(q.text||"")}" placeholder="نص السؤال (اختياري)">`;
    case"mcq":return `<input class="inp t" data-i="${i}" data-f="text" value="${esc(q.text)}" placeholder="نص السؤال">`+q.opts.map((o,j)=>`<label class="chk" style="font-size:.85rem"><input type="radio" name="c${i}" data-i="${i}" data-f="c" value="${j}" ${q.c===j?"checked":""} aria-label="الإجابة الصحيحة"><input class="inp" style="width:90px" data-i="${i}" data-f="o${j}" value="${esc(o)}" placeholder="خيار"></label>`).join("")
      +`<button class="btn sm" data-qo="${i}" type="button">+ خيار</button>`;
  }
}

function readMeta(){const w=editW;w.type=$("eType").value;w.title=$("eTitle").value.trim();w.date=$("eDate").value.trim();
  w.duration=parseInt(EN($("eDur").value),10)||0;w.sections=[$("eS1").checked&&"1",$("eS2").checked&&"2"].filter(Boolean);w.showScore=$("eShow").checked;w.status=$("eStatus").value}
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
/* ================= توليد الأسئلة حسب دروس كتاب الرياضيات — الصف الثاني، الفصل الدراسي الأول ================= */
const CUR=(()=>{
  const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const mix=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const D=n=>AD(n);
  const U=["","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة"],T=["","عشرة","عشرون","ثلاثون","أربعون","خمسون","ستون","سبعون","ثمانون","تسعون"];
  const words=n=>{if(n===100)return"مئة";if(n<10)return n?U[n]:"صفر";if(n===10)return"عشرة";if(n===11)return"أحد عشر";if(n===12)return"اثنا عشر";
    if(n<20)return U[n%10]+" عشر";const t=Math.floor(n/10),u=n%10;return u?U[u]+" و"+T[t]:T[t]};
  /* سؤال اختيار من متعدد بخيارات مخلوطة */
  const mcq=(text,right,wrong)=>{const all=[...new Set([String(right),...wrong.map(String)])].filter(x=>x!=="").slice(0,4);const o=mix(all);return{t:"mcq",text,opts:o,c:o.indexOf(String(right))}};
  const near=(v,lo,hi)=>{const s=new Set();let k=0;while(s.size<3&&k++<50){const x=v+pick([-10,-2,-1,1,2,10,9,-9]);if(x!==v&&x>=lo&&x<=hi)s.add(x)}return[...s]};
  const two=()=>{let n;do{n=R(11,99)}while(n%10===0);return n};
  const fill=t=>({t:"fill",text:t});
  const cnt=(n,one,two,pl)=>n===1?one+" واحدة":n===2?two:D(n)+" "+pl;
  /* بيانات للرسوم */
  const BANK=[{t:"الفاكهة المفضلة",c:["تفاح","موز","برتقال","عنب","فراولة"],ic:"🍎",w:"طالبًا يفضّل"},
    {t:"الألوان المفضلة",c:["أحمر","أزرق","أخضر","أصفر"],ic:"⭐",w:"طالبًا يفضّل اللون"},

const genSel={c:0,l:"all",n:5};
const genLessons=c=>`<option value="all" ${genSel.l==="all"?"selected":""}>كل دروس الفصل (مراجعة)</option>`+CUR[c].lessons.map((l,k)=>`<option value="${k}" ${String(k)===String(genSel.l)?"selected":""}>${AD(k+1)}. ${l.name}</option>`).join("");
function genFrom(c,l,n){const L=CUR[c].lessons,out=[];for(let k=0;k<n;k++){const les=l==="all"?L[k%L.length]:L[+l];let q,tries=0;
  do{q=les.gen();tries++}while(tries<20&&out.some(x=>JSON.stringify(x)===JSON.stringify(q)));out.push(q)}
  if(l==="all")out.sort((a,b)=>String(a.t).localeCompare(String(b.t)));return out}
function gen(t,mx){switch(t){
  case"add":{const s=ri(Math.max(3,Math.ceil(mx*.4)),Math.min(mx,99)),a=ri(1,s-1);return{t,a,b:s-a}}
  case"sub":{const a=ri(Math.max(4,Math.ceil(mx*.4)),Math.min(mx,99));return{t,a,b:ri(1,a-1)}}
  case"cmp":{const a=ri(1,mx),k=ri(0,2);return{t,a,b:k===0?a:k===1?Math.max(0,a-ri(1,Math.max(1,a))):a+ri(1,5)}}
  case"pv":{let n;do{n=ri(11,99)}while(n%10===0);return{t,n}}
  case"mk":return{t,tn:ri(1,9),on:ri(0,9)}}}

      if(q.t==="fill"){const b=QX.blanks(q);if(!b.length)bad.push(p+"ضع الإجابة بين قوسين [ ]");else if(!b.every(QX.isN))bad.push(p+"ما بين القوسين يجب أن يكون رقمًا")}
      if(q.t==="order"&&(q.items||[]).length<2)bad.push(p+"اكتب عنصرين على الأقل للترتيب");
      if(q.t==="match"){q.pairs=(q.pairs||[]).map(x=>[String(x[0]).trim(),String(x[1]).trim()]).filter(x=>x[0]||x[1]);if(q.pairs.length<2||q.pairs.some(x=>!x[0]||!x[1]))bad.push(p+"أكمل زوجين على الأقل للتوصيل")}
      if(q.t==="chart"){if((q.cats||[]).length<2)bad.push(p+"اكتب البيانات بهذا الشكل: تفاح=٦، موز=٣");else if(!String(q.ask||"").trim())bad.push(p+"اكتب سؤال القراءة");
        else if((q.opts||[]).length?!(q.c>=0&&q.c<q.opts.length):String(q.ans??"")==="")bad.push(p+"حدّد الإجابة الصحيحة")}
      if(q.t==="make"){if(!(q.cats||[]).length)bad.push(p+"اكتب البيانات بهذا الشكل: أحمر=٣، أزرق=٥");else if(Math.max(...q.vals)>(q.max||0)||q.max>12)bad.push(p+"أعلى ارتفاع يجب أن يساوي أكبر قيمة أو أكثر (حتى ١٢)")}
      if(q.t==="tally"&&!(q.n>=1&&q.n<=40))bad.push(p+"العدد من ١ إلى ٤٠");
      if(q.t==="mcq"){q.opts=q.opts.map(o=>o.trim());if(!q.text.trim()||q.opts.filter(Boolean).length<2||!q.opts[q.c])bad.push(p+"اكتب السؤال وخيارين على الأقل وحدّد الصحيح")}});
    if(bad.length)return toast(bad[0]);
    if(w.questions.some(q=>q.t==="mcq"))w.questions.forEach(q=>{if(q.t==="mcq"){const keep=q.opts.map((o,j)=>[o,j]).filter(([o])=>o);q.c=keep.findIndex(([,j])=>j===q.c);q.opts=keep.map(([o])=>o)}});
    DB=load();
    if(w.id){const i=DB.works.findIndex(x=>x.id===w.id);
      const R=DB.rec[w.id]||{};Object.values(R).forEach(r=>{if(r.submitted)r.score=scoreOf(w,r.ans)});DB.works[i]=w}
    else{w.id=uid();w.created=Date.now();DB.works.push(w)}
    save();toast("تم الحفظ");openTeacher("works");
  }
});

function drawMonitor(){

  list.forEach((s,n)=>{const r=R[s.k]||{};
    let st;if(r.submitted)st=`<span class="badge b-ok">${r.timeUp?"انتهى الوقت":"سلّم"}</span>`;else if(expired(w,r))st=`<span class="badge b-ok">انتهى الوقت</span>`;

      <span class="muted" style="font-size:.82rem">تُطبَّق فورًا حتى على من بدأ (عدا من له وقت خاص). ٠ = بدون وقت.</span></div>
    <div class="card"><h3>إجراءات للجميع</h3><div class="row"><button class="btn sm" data-a5all type="button">+٥ دقائق لمن يحل الآن</button><button class="btn danger sm" data-rsall type="button">إعادة العمل للجميع</button></div></div>
    <div class="card"><h3>الملخص</h3><div class="stat"><span>لم يبدأ: ${AD(c.no)}</span><span>يحل الآن: ${AD(c.run)}</span><span>سلّم: ${AD(c.ok)}</span></div>
      <div class="row"><span class="muted">عرض:</span><select class="inp" id="mFilter"><option value="all">الكل</option>${w.sections.map(s=>`<option value="${s}" ${f===s?"selected":""}>${secName(s)}</option>`).join("")}</select></div></div>

$("tView").addEventListener("click",async e=>{

function sheetHead(right2){return `<div class="hdr"><div>المملكة العربية السعودية<br>${SCHOOL.moe}<br>${SCHOOL.admin}<br>${SCHOOL.name}</div><div><img src="${LOGO}" alt=""></div><div>${right2}</div></div>`}
function workSheet(w,s){
  const R=DB.rec[w.id]||{},L=bySec(s),n=w.questions.length;let got=[];
  const rows=L.map((x,i)=>{const r=R[x.k]||{};let sc="",pc="",note="";
    if(r.submitted){sc=AD(r.score);pc=AD(Math.round(r.score/n*100))+"٪";got.push(r.score);note=r.timeUp?"انتهى الوقت":""}
    else if(expired(w,r)){const v=scoreOf(w,r.ans);sc=AD(v);pc=AD(Math.round(v/n*100))+"٪";got.push(v);note="انتهى الوقت"}
    else note=r.start?"لم يُسلّم":"لم يحل";
    return `<tr><td>${AD(i+1)}</td><td class="nm">${esc(x.n)}</td><td>${sc}</td><td>${sc?AD(n):""}</td><td>${pc}</td><td>${note}</td></tr>`}).join("");
  const avg=got.length?got.reduce((a,b)=>a+b,0)/got.length:0;

    <div class="sum"><span>عدد الطلاب : ${AD(L.length)}</span><span>المؤدّون : ${AD(got.length)}</span><span>المتوسط : ${AD((Math.round(avg*10)/10).toString())}</span><span>الأعلى : ${got.length?AD(Math.max(...got)):"—"}</span><span>الأدنى : ${got.length?AD(Math.min(...got)):"—"}</span></div>
    <div class="sig"><div>معلم المادة : ${SCHOOL.teacher}<br>التوقيع : ..................</div><div>مدير المدرسة : ${SCHOOL.principal}<br>التوقيع : ..................</div></div>
  </article></div>`;
}
function bookSheet(s){

    return `<tr><td>${AD(i+1)}</td><td class="nm">${esc(x.n)}</td>${cells}<td><b>${AD(sum)}</b></td><td>${tot?AD(Math.round(sum/tot*100))+"٪":""}</td></tr>`}).join("");

    <div class="sig"><div>معلم المادة : ${SCHOOL.teacher}<br>التوقيع : ..................</div><div>مدير المدرسة : ${SCHOOL.principal}<br>التوقيع : ..................</div></div></article></div>`;

/* ================= التاريخ والوقت للطالب ================= */
function tickClock(){const d=new Date();let day="",tm="";
  try{day=new Intl.DateTimeFormat("ar-SA",{weekday:"long"}).format(d)}catch(e){}
  try{tm=new Intl.DateTimeFormat("ar-SA-u-nu-arab",{hour:"numeric",minute:"2-digit",hour12:true}).format(d)}catch(e){tm=AD(d.getHours()%12||12)+":"+AD(String(d.getMinutes()).padStart(2,"0"))}
  document.querySelectorAll(".js-date").forEach(x=>x.textContent=(day?day+" ":"")+hijriToday());document.querySelectorAll(".js-time").forEach(x=>x.textContent=tm)}
tickClock();setInterval(tickClock,15000);
