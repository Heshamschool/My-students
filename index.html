<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كشف درجات الثاني الابتدائي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@700&display=swap">
<style>
/* Layout: official ministry sheet — letterhead (ministry lines right, logo center, sheet info left), grade table; printable copy rendered separately in #printRoot */
:root{
  --bg:#f3f6f5; --paper:#ffffff; --ink:#1d2b29; --muted:#5f716e; --line:#c9d6d3;
  --teal:#0b8a7a; --teal-soft:#e3f2ef; --grey-head:#eef2f1; --warn:#c0392b; --warn-soft:#fbe6e3;
  --f-body:"Tajawal","Segoe UI",Tahoma,sans-serif; --f-display:"Amiri","Traditional Arabic",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1716; --paper:#17221f; --ink:#e4eeec; --muted:#9db0ac; --line:#2f403c;
  --teal:#36c2ad; --teal-soft:#1d3531; --grey-head:#1e2b28; --warn:#ff8a7a; --warn-soft:#3d2320; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1716; --paper:#17221f; --ink:#e4eeec; --muted:#9db0ac; --line:#2f403c;
  --teal:#36c2ad; --teal-soft:#1d3531; --grey-head:#1e2b28; --warn:#ff8a7a; --warn-soft:#3d2320; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);direction:rtl;text-align:right;padding-inline:16px;padding-block:16px 40px;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:9px 16px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-weight:700;padding:9px 14px;border-radius:10px;cursor:pointer}
.btn.icon{padding:8px 10px;display:inline-flex;align-items:center}
.save{font-size:12.5px;color:var(--teal);font-weight:700;padding-inline:4px}
.save[data-s="err"]{color:var(--warn)}
.actions{align-items:center}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.hint{font-size:12.5px;color:var(--muted)}

/* settings */
.settings{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.settings h2{margin:0;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.field input,.field select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-align:center}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.cat{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--bg)}
.cat .field:first-child{grid-column:1/-1}
.sum-line{font-weight:700;color:var(--teal)}

/* sheet */
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:22px 22px 26px}
.head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;border-bottom:3px double var(--teal);padding-bottom:12px}
.hr{justify-self:start;display:flex;flex-direction:column;align-items:center;text-align:center;font-weight:700;font-size:13.5px;line-height:1.75}
.hc{justify-self:center}
.hl{justify-self:end;display:grid;grid-template-columns:max-content max-content;column-gap:8px;font-size:13.5px;line-height:1.75;margin:0}
.hl dt{font-weight:700;text-align:right}
.hl dt::after{content:" :"}
.hl dd{margin:0;font-weight:800;color:var(--teal);text-align:right}
.logo{width:120px;height:auto;display:block;background:#fff;border-radius:6px}
.title{text-align:center;margin:14px 0 4px;font-family:var(--f-display);font-size:26px;color:var(--teal);text-wrap:balance}
.sub{text-align:center;color:var(--muted);font-weight:500;margin:0 0 14px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);text-align:center;vertical-align:middle;padding:0}
thead th{background:var(--grey-head);font-weight:700;font-size:12.5px;padding:6px 4px}
thead tr.g th{background:var(--teal-soft);color:var(--ink)}
thead .mx{display:block;font-weight:500;color:var(--muted);font-size:11px}
td.n{width:34px;font-weight:700;color:var(--muted)}
td.name{min-width:230px;padding:4px 10px;font-weight:500;white-space:nowrap;text-align:right}
td.sc{width:42px}
td.sc input{width:100%;min-width:38px;height:32px;border:0;background:transparent;text-align:center;font:inherit;font-weight:700;color:var(--ink)}
td.sc.bad{background:var(--warn-soft)} td.sc.bad input{color:var(--warn)}
td.sub-t{width:58px;font-weight:800;background:var(--grey-head)}
td.sc.fin{width:58px}
td.tot{width:62px;font-weight:800;color:var(--teal);background:var(--teal-soft)}
td.note{min-width:180px}
td.note input{width:100%;height:32px;border:0;background:transparent;font:inherit;text-align:center;color:var(--ink);padding:0 6px}
tbody tr:nth-child(even) td:not(.tot):not(.sub-t){background:color-mix(in srgb,var(--grey-head) 45%,transparent)}
tbody tr:nth-child(even) td.sc.bad{background:var(--warn-soft)}
/*unused*/.foot{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px;font-weight:700;text-align:center}
.foot .sig{display:flex;flex-direction:column;gap:10px}
.foot .ln{color:var(--muted);font-weight:500}
.print-only{display:none}

@media (max-width:640px){
  .wrap .head,.rbox .head{grid-template-columns:1fr 1fr}
  .wrap .hc,.rbox .hc{grid-column:1/-1;grid-row:1}
  .wrap .hr,.wrap .hl,.rbox .hr,.rbox .hl{font-size:12px}
  .wrap .logo,.rbox .logo{width:90px}
  .wrap .sheet,.rbox .rdoc{padding:14px}
  .wrap .title,.rbox .title{font-size:21px}
}
.sync{font-size:12.5px;font-weight:700;padding-inline:4px;color:var(--muted)}
.sync[data-s="ok"]{color:var(--teal)}
.sync[data-s="err"]{color:var(--warn)}
.btn[disabled]{opacity:.6;cursor:progress}

/* printable copy: used by native print and by PDF export */
#printRoot{display:none}
.P{--bg:#fff;--paper:#fff;--ink:#000;--muted:#333;--line:#555;--teal:#0b6f63;--teal-soft:#e8f3f1;--grey-head:#eef2f1;--warn:#c0392b;--warn-soft:#fbe6e3;
  color-scheme:light;color:var(--ink);background:#fff;font-family:var(--f-body);direction:rtl;text-align:right;font-size:9pt;width:196mm;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.P .sheet{border:0;padding:0;border-radius:0;background:#fff}
.P .pb{break-before:page;page-break-before:always}
.P .tbl-wrap{overflow:visible}
.P table{table-layout:fixed;width:100%}
.P col.k-n{width:6mm} .P col.k-name{width:55mm} .P col.k-sc{width:7mm} .P col.k-sub{width:9mm} .P col.k-fin{width:9mm} .P col.k-tot{width:10mm}
.P th,.P td{border-color:#666}
.P thead th{font-size:7.5pt;padding:1mm .5mm;line-height:1.25}
.P thead .mx{font-size:6.5pt}
.P td.n{width:auto;font-size:8pt}
.P td.name{white-space:nowrap;overflow:hidden;font-size:8pt;padding:0 1.5mm;min-width:0}
.P td.sc,.P td.tot,.P td.sub-t,.P td.sc.fin{width:auto;height:6.4mm;font-size:9pt;font-weight:700}
.P td.note{min-width:0;font-size:7.5pt}
.P .head{grid-template-columns:1fr auto 1fr;padding-bottom:2.5mm;gap:4mm}
.P .hr,.P .hl{font-size:9pt;line-height:1.65}
.P .title{font-size:15pt;margin:3mm 0 0}
.P .sub{margin:0 0 2.5mm;font-size:8pt}
.P .logo{width:30mm}
.P tr{break-inside:avoid;page-break-inside:avoid}
.P tbody tr:nth-child(even) td:not(.tot):not(.sub-t){background:transparent}
.P .rdoc{border:0;border-radius:0;padding:0;font-size:12pt;gap:4mm;background:#fff}
.P .rdoc .hr,.P .rdoc .hl{font-size:10.5pt}
.P .rdoc .title{font-size:18pt}
.P table.rt{table-layout:auto}
.P table.rt td,.P table.rt th{padding:2mm;font-size:11pt}
.P .rsig{margin-top:14mm}
@media print{
  @page{size:A4 portrait;margin:8mm 7mm}
  :root{padding:0!important}
  body.printing{padding:0;background:#fff}
  body.printing > :not(#printRoot){display:none!important}
  body.printing #printRoot{display:block}
}
/* behaviour */
.bh{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;width:100%;box-sizing:border-box;padding:0 6px;font-size:12px;height:32px;white-space:nowrap;overflow:hidden}
.bh .cnt{background:var(--warn-soft);color:var(--warn);font-weight:700;border-radius:999px;padding:2px 10px}
.bh .add{color:var(--muted);font-size:12px}
.bh:hover{background:var(--teal-soft)}
.bh:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
.bhbox{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:560px;gap:10px}
.bhbox h2{margin:0;font-size:17px}
.bhn{margin:0;color:var(--teal);font-weight:700}
.bhlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px}
.chk{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--bg)}
.chk input{accent-color:var(--teal);width:18px;height:18px;flex:none}
.chk:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.secs{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0;width:100%}
.secs legend{font-size:12.5px;color:var(--muted);padding-inline:4px}
#rSecs{display:flex;flex-wrap:wrap;gap:6px}
#rSecs .chk{padding:6px 10px}
.rnotes ul{margin:2px 0 0;padding-inline-start:22px}
.settings textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
/* names as buttons */
.nm{all:unset;cursor:pointer;display:block;width:100%;text-align:right}
.nm:hover{color:var(--teal);text-decoration:underline}
.nm:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
/* students panel */
.addrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.grow{flex:1 1 220px}
.stlist{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto;padding-inline-end:4px}
.strow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px;align-items:center}
.strow input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
.strow .sn{color:var(--muted);font-weight:700;text-align:center}
.btn.del{padding:6px 12px;color:var(--warn)}

/* report overlay */
.overlay{position:fixed;inset:0;background:rgba(10,20,18,.55);overflow:auto;z-index:20;padding:20px 16px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
body.ov{overflow:hidden}
.rbox{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.rctl{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.rctl .field{flex:1 1 160px}
.rctl .grow{flex:2 1 260px}
.ract{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff;text-decoration:none;display:inline-flex;align-items:center}
.rdoc{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:12px;line-height:1.8}
.rdoc .title{margin:6px 0 0}
.rto p{margin:0}
.rname{font-size:16px;background:var(--teal-soft);border-radius:8px;padding:8px 12px;text-align:center}
.rname b{color:var(--teal)}
table.rt td{padding:6px 8px}
table.rt td.rl{font-weight:700;text-align:right}
table.rt td.rv{font-weight:800;color:var(--teal)}
table.rt tr.rs td{background:var(--grey-head)}
.rlvl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rlvl div{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;display:flex;flex-direction:column}
.rlvl span{color:var(--muted);font-size:12.5px}
.rlvl b{font-size:18px}
.rlvl b[data-l="g"]{color:var(--teal)} .rlvl b[data-l="m"]{color:#b7791f} .rlvl b[data-l="w"]{color:var(--warn)}
.rnotes p{margin:0} .rnotes span{font-weight:700}
.rend{text-align:center;margin:4px 0 0;font-weight:700}
.rsig{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-weight:700;margin-top:16px}
</style>

<div class="wrap">
  <div class="bar no-print">
    <div class="seg" role="group" aria-label="اختيار الفصل">
      <button id="tab1" aria-pressed="true" data-c="1">الفصل ١</button>
      <button id="tab2" aria-pressed="false" data-c="2">الفصل ٢</button>
    </div>
    <div class="actions">
      <span class="sync" id="saveState" data-s="ok">الحفظ تلقائي</span>
      <button class="btn" id="btnStudents" aria-expanded="false">الطلاب</button>
      <button class="btn icon" id="btnSettings" aria-label="الإعدادات" title="الإعدادات" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      <select class="btn" id="printScope" aria-label="نطاق الطباعة">
        <option value="cur">الفصل الحالي</option>
        <option value="all">الفصلان</option>
      </select>
      <button class="btn primary" id="btnPrint">طباعة</button>
      <button class="btn primary" id="btnPdf" hidden>تنزيل نسخة للطباعة</button>
    </div>
  </div>
  <p class="hint no-print">اضغط على اسم أي طالب لعرض تقريره وإرسال إشعار بمستواه.</p>

  <section class="settings no-print" id="settings" hidden>
    <h2>الإعدادات</h2>
    <div class="grid">
      <div class="field"><label for="s_subject">المادة</label><input id="s_subject"></div>
      <div class="field"><label for="s_term">الفصل الدراسي</label>
        <select id="s_term"><option>الأول</option><option>الثاني</option><option>الثالث</option></select></div>
      <div class="field"><label for="s_year">العام الدراسي</label><input id="s_year"></div>
      <div class="field"><label for="s_sc">جوال الموجه الطلابي (للواتساب)</label><input id="s_sc" inputmode="tel" placeholder="05xxxxxxxx"></div>
    </div>
    <div class="cats" id="catsBox"></div>
    <div class="sum-line" id="sumLine"></div>
    <div class="field"><label for="s_beh">قائمة الملاحظات السلوكية (كل ملاحظة في سطر)</label><textarea id="s_beh" rows="6"></textarea></div>
    <div class="actions"><button class="btn primary" id="btnClose">تم</button>
      <button class="btn" id="btnClear">مسح درجات الفصل الحالي</button>
      <span class="hint" id="clearConfirm" hidden>اضغط مرة ثانية للتأكيد</span></div>
  </section>

  <section class="settings no-print" id="studentsBox" hidden>
    <h2 id="stTitle">طلاب الفصل</h2>
    <form class="addrow" id="addForm">
      <div class="field grow"><label for="newName">اسم الطالب الجديد</label><input id="newName" required></div>
      <button class="btn primary" type="submit">إضافة طالب</button>
    </form>
    <div class="stlist" id="stList"></div>
    <div class="actions"><button class="btn primary" id="btnStClose">تم</button><button class="btn" id="btnSort">ترتيب أبجدي</button></div>
  </section>

  <div id="sheets"></div>
</div>

<div class="overlay" id="report" hidden>
  <div class="rbox">
    <div class="rctl no-print">
      <div class="field"><label for="rTo">الإشعار موجّه إلى</label>
        <select id="rTo"><option value="p">ولي أمر الطالب</option><option value="s">الموجه الطلابي</option></select></div>
      <div class="field grow"><label for="rMsg">ملاحظة المعلم (تظهر في الإشعار)</label><input id="rMsg" placeholder="مثال: نأمل متابعة حل الواجبات في المنزل"></div>
      <fieldset class="secs"><legend>الأقسام التي تظهر في الإشعار</legend><div id="rSecs"></div></fieldset>
      <div class="ract">
        <a class="btn wa" id="rWa" href="#" target="_blank" rel="noopener">إرسال واتساب للموجه الطلابي</a>
        <button class="btn" id="rCopy">نسخ النص</button>
        <button class="btn primary" id="rPrint">طباعة</button>
        <button class="btn primary" id="rPdf" hidden>تنزيل للطباعة</button>
        <button class="btn" id="rClose">إغلاق</button>
      </div>
      <span class="hint" id="rStatus" role="status"></span>
    </div>
    <article class="rdoc" id="rDoc"></article>
  </div>
</div>

<div class="overlay" id="behPop" hidden>
  <div class="rbox bhbox">
    <h2>الملاحظات السلوكية</h2>
    <p class="bhn" id="bhName"></p>
    <div class="bhlist" id="bhList"></div>
    <div class="field"><label for="bhOther">ملاحظة أخرى</label><input id="bhOther"></div>
    <div class="actions"><button class="btn primary" id="bhDone">حفظ</button><button class="btn" id="bhClear">مسح الكل</button></div>
  </div>
</div>

const AR="٠١٢٣٤٥٦٧٨٩";
const toAr=v=>String(v).replace(/\d/g,d=>AR[d]).replace(/\./g,"٫");
const toEn=v=>String(v).replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٫,]/g,".").trim();

/* ---------- storage: this device + shared store across devices ---------- */
let db=null;
const pending=new Map(),inflight=new Set();
const busy=p=>pending.has(p)||inflight.has(p);
function setSync(state,text){const el=$("saveState");el.dataset.s=state;el.textContent=text}
function stamp(){const d=new Date();return toAr(d.getHours()%12||12)+":"+toAr(String(d.getMinutes()).padStart(2,"0"))}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){return false}}
function persist(path,body){
  const okLocal=saveLocal();
  if(!db){setSync(okLocal?"ok":"err",okLocal?"حُفظ على هذا الجهاز "+stamp():"تعذّر الحفظ على هذا الجهاز");return}
  setSync("","جارٍ الحفظ…");
  clearTimeout(pending.get(path));
  pending.set(path,setTimeout(async()=>{pending.delete(path);inflight.add(path);
    try{await db.doc(path).set(body())}
    catch(e){try{await new Promise(r=>setTimeout(r,800+Math.random()*700));await db.doc(path).set(body())}
      catch(e2){inflight.delete(path);setSync("err","تعذّر الحفظ، تحقق من الاتصال");return}}
    inflight.delete(path);
    if(!pending.size&&!inflight.size)setSync("ok","حُفظ ومتزامن "+stamp());
  },600));
}
const gPath=(c,id)=>`grades/c${c}-${id}`;
const saveCfg=()=>persist("cfg/main",()=>({settings:clone(S.settings),students:clone(S.students)}));
const saveRec=(c,id)=>persist(gPath(c,id),()=>{const r=rec(c,id);return{c:+c,id:String(id),s:clone(r.s||{}),beh:clone(r.beh||[]),note:r.note||""}});
async function delRec(c,id){if(S.data[c])delete S.data[c][id];saveLocal();if(db){try{await db.doc(gPath(c,id)).delete()}catch(e){}}}

async function connect(){
  if(!window.claude||!claude.use)return;
  let d=null;try{d=await claude.use("db")}catch(e){}
  if(!d)return;
  setSync("","جارٍ المزامنة…");
  try{
    const cfg=await d.doc("cfg/main").get();
    if(!cfg.exists){ /* first run: upload what this device has */
      await d.doc("cfg/main").set({settings:clone(S.settings),students:clone(S.students)});
      for(const c of [1,2])for(const id in (S.data[c]||{})){const r=S.data[c][id];
        if(Object.keys(r.s||{}).length||(r.beh||[]).length||r.note)await d.doc(gPath(c,id)).set({c,id:String(id),s:clone(r.s||{}),beh:clone(r.beh||[]),note:r.note||""})}
    }
  }catch(e){setSync("err","المزامنة غير متاحة، الحفظ على هذا الجهاز فقط");return}
  db=d;
  db.doc("cfg/main").onSnapshot(sn=>{
    if(!sn.exists||sn.metadata.hasPendingWrites||busy("cfg/main"))return;
    const v=sn.data();if(!v.settings||!v.students)return;
    const a=JSON.stringify({s:v.settings,t:v.students}),b=JSON.stringify({s:S.settings,t:S.students});if(a===b)return;
    S.settings=clone(v.settings);S.students=clone(v.students);
    if(!S.settings.beh)S.settings.beh=BEH.slice();
    saveLocal();render();
    if(!$("settings").hidden&&!$("settings").contains(document.activeElement))fillSettings();
    if(!$("studentsBox").hidden&&!$("studentsBox").contains(document.activeElement))fillStudents();
  },()=>setSync("err","انقطعت المزامنة، أعد فتح الصفحة"));
  let first=true;
  db.collection("grades").onSnapshot(qs=>{
    qs.docChanges().forEach(ch=>{const v=ch.doc.data()||{};const c=v.c,id=v.id;if(!c||id===undefined)return;
      if(busy(gPath(c,id))||ch.doc.metadata.hasPendingWrites)return;
      if(ch.type==="removed"){if(S.data[c])delete S.data[c][id]}
      else (S.data[c]||(S.data[c]={}))[id]={s:clone(v.s||{}),beh:clone(v.beh||[]),note:v.note||""};
      if(!first)updateRow(c,id)});
    if(first){first=false;render()}
    saveLocal();
    if(!pending.size&&!inflight.size)setSync("ok","متزامن "+stamp());
  },()=>setSync("err","انقطعت المزامنة، أعد فتح الصفحة"));
}

/* ---------- grades sheet ---------- */
const rec=(c,id)=>{const d=S.data[c]||(S.data[c]={});return d[id]||(d[id]={s:{},beh:[],note:""})};
const maxOf=g=>S.settings.cats.filter(c=>!g||c.g===g).reduce((a,c)=>a+c.count*c.max,0);
const totalMax=()=>maxOf();
const isNum=v=>v!==""&&v!==undefined&&v!==null&&!isNaN(+v);
const isBad=(v,max)=>v!==undefined&&v!==""&&(isNaN(+v)||+v>max||+v<0);
const behList=r=>[...(r.beh||[]),...(r.note&&r.note.trim()?[r.note.trim()]:[])];
function behLabel(l){return l.length===1?"ملاحظة واحدة":l.length===2?"ملاحظتان":toAr(l.length)+(l.length<=10?" ملاحظات":" ملاحظة")}
function behHTML(r){const l=behList(r);return l.length?`<span class="cnt">${behLabel(l)}</span>`:'<span class="add">＋ إضافة</span>'}
function cell(c,id,row,nm,ct,j,r,P){const v=(r.s[ct.k]||[])[j];const show=v===undefined||v===""?"":toAr(v);
  const cls=`sc${isBad(v,ct.max)?" bad":""}${ct.g==="f"?" fin":""}`;
  if(P)return `<td class="${cls}">${show}</td>`;
  return `<td class="${cls}"><input id="c${c}-${row}-${ct.k}-${j}" inputmode="decimal" autocomplete="off" aria-label="${esc(nm)} ${esc(ct.label)} ${j+1}" data-c="${c}" data-i="${id}" data-r="${row}" data-k="${ct.k}" data-j="${j}" data-max="${ct.max}" value="${show}"></td>`}

function headHTML(c){const st=S.settings;
  return `<header class="head">
    <div class="hr"><span>المملكة العربية السعودية</span><span>وزارة التعليم</span><span>الإدارة العامة للتعليم بمنطقة الرياض</span><span>ابتدائية هشام بن عبدالملك</span></div>
    <div class="hc"><img class="logo" src="${LOGO}" alt="شعار وزارة التعليم"></div>
    <dl class="hl"><dt>العام الدراسي</dt><dd>${esc(st.year)}</dd><dt>الفصل الدراسي</dt><dd>${esc(st.term)}</dd><dt>الصف</dt><dd>الثاني الابتدائي / ${toAr(c)}</dd><dt>المادة</dt><dd>${esc(st.subject)}</dd></dl>
   </header>`}
function colg(){let x='<colgroup><col class="k-n"><col class="k-name">';
  S.settings.cats.filter(t=>t.g==="y").forEach(t=>{for(let j=0;j<t.count;j++)x+='<col class="k-sc">'});
  x+='<col class="k-sub">';
  S.settings.cats.filter(t=>t.g==="f").forEach(t=>{for(let j=0;j<t.count;j++)x+='<col class="k-fin">'});
  return x+'<col class="k-tot"><col class="k-note"></colgroup>'}
function sheetHTML(c,P){
  const st=S.settings,Y=st.cats.filter(x=>x.g==="y"),F=st.cats.filter(x=>x.g==="f");
  const yCols=Y.reduce((a,x)=>a+x.count,0)+1;
  let r1=`<tr class="g"><th rowspan="3">م</th><th rowspan="3">اسم الطالب</th><th colspan="${yCols}">أعمال السنة<span class="mx">من ${toAr(maxOf("y"))}</span></th>`;
  F.forEach(ct=>r1+=`<th rowspan="${ct.count>1?2:3}" colspan="${ct.count}">${esc(ct.label)}<span class="mx">من ${toAr(ct.count*ct.max)}</span></th>`);
  r1+=`<th rowspan="3">المجموع<span class="mx">من ${toAr(totalMax())}</span></th><th rowspan="3">الملاحظات السلوكية</th></tr>`;
  let r2='<tr>',r3='<tr>';
  Y.forEach(ct=>{r2+=`<th colspan="${ct.count}">${esc(ct.label)}<span class="mx">${toAr(ct.count*ct.max)} درجة${ct.count>1?" (كل منها "+toAr(ct.max)+")":""}</span></th>`;
    for(let j=1;j<=ct.count;j++)r3+=`<th>${toAr(j)}</th>`});
  r2+=`<th rowspan="2">المجموع<span class="mx">${toAr(maxOf("y"))}</span></th></tr>`;
  F.forEach(ct=>{if(ct.count>1)for(let j=1;j<=ct.count;j++)r3+=`<th>${toAr(j)}</th>`});r3+='</tr>';
  let b='';
  S.students[c].forEach((s,row)=>{const id=s.id,nm=s.name,r=rec(c,id),bl=behList(r);
    b+=`<tr data-row="${c}-${id}"><td class="n">${toAr(row+1)}</td><td class="name">${P?esc(nm):`<button class="nm" data-c="${c}" data-id="${id}" title="تقرير الطالب">${esc(nm)}</button>`}</td>`;
    Y.forEach(ct=>{for(let j=0;j<ct.count;j++)b+=cell(c,id,row,nm,ct,j,r,P)});
    b+=`<td class="sub-t" id="${P?"":"y"+c+"-"+id}">${totOf(c,id,"y")}</td>`;
    F.forEach(ct=>{for(let j=0;j<ct.count;j++)b+=cell(c,id,row,nm,ct,j,r,P)});
    b+=`<td class="tot"${P?"":` id="t${c}-${id}"`}>${totOf(c,id)}</td><td class="note">${P?(bl.length?behLabel(bl):""):`<button class="bh" id="n${c}-${id}" data-c="${c}" data-i="${id}" title="${esc(bl.join("، "))}" aria-label="الملاحظات السلوكية لـ ${esc(nm)}">${behHTML(r)}</button>`}</td></tr>`});
  return `<article class="sheet" data-c="${c}">${headHTML(c)}
   <h1 class="title">كشف متابعة درجات الطلاب</h1>
   <p class="sub">عدد الطلاب: ${toAr(S.students[c].length)} طالبًا</p>
   <div class="tbl-wrap"><table>${colg()}<thead>${r1+r2}${r3}</thead><tbody>${b}</tbody></table></div>
  </article>`;
}
function sumOf(c,id,g){const r=rec(c,id);let t=0,n=0;
  S.settings.cats.filter(ct=>!g||ct.g===g).forEach(ct=>(r.s[ct.k]||[]).slice(0,ct.count).forEach(v=>{if(isNum(v)){t+=+v;n++}}));
  return {t,n}}
function totOf(c,id,g){const s=sumOf(c,id,g);return s.n?fmt(s.t):""}
function render(){$("sheets").innerHTML=sheetHTML(1)+sheetHTML(2);showCur()}
function updateRow(c,id){const r=rec(c,id);
  document.querySelectorAll(`input[data-c="${c}"][data-i="${id}"][data-k]`).forEach(inp=>{
    const v=(r.s[inp.dataset.k]||[])[+inp.dataset.j];
    if(document.activeElement!==inp)inp.value=v===undefined||v===""?"":toAr(v);
    inp.parentElement.classList.toggle("bad",isBad(v,+inp.dataset.max))});
  const t=$(`t${c}-${id}`),y=$(`y${c}-${id}`),b=$(`n${c}-${id}`);
  if(t)t.textContent=totOf(c,id);if(y)y.textContent=totOf(c,id,"y");
  if(b){b.innerHTML=behHTML(r);b.title=behList(r).join("، ")}
  if(R&&R.c==c&&R.id==id)renderReport();
}
function showCur(){
  document.querySelectorAll("#sheets .sheet").forEach(s=>s.hidden=+s.dataset.c!==cur);
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.c===cur));
  if(!$("studentsBox").hidden)fillStudents();
}
document.querySelector(".seg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cur=+b.dataset.c;showCur()});

const sheets=$("sheets");
sheets.addEventListener("input",e=>{const t=e.target,c=t.dataset.c,id=t.dataset.i;if(!c||!t.dataset.k)return;
  const r=rec(c,id),raw=toEn(t.value),k=t.dataset.k,j=+t.dataset.j,max=+t.dataset.max;
  (r.s[k]||(r.s[k]=[]))[j]=raw===""?"":raw;
  t.parentElement.classList.toggle("bad",isBad(raw,max));
  $(`t${c}-${id}`).textContent=totOf(c,id);$(`y${c}-${id}`).textContent=totOf(c,id,"y");saveRec(c,id);
});
sheets.addEventListener("focusout",e=>{const t=e.target;if(t.dataset&&t.dataset.k){const v=toEn(t.value);t.value=v===""?"":toAr(v)}});
sheets.addEventListener("keydown",e=>{const t=e.target;if(e.key!=="Enter"||!t.dataset.k)return;e.preventDefault();
  const nx=$(`c${t.dataset.c}-${+t.dataset.r+1}-${t.dataset.k}-${t.dataset.j}`);if(nx){nx.focus();nx.select()}});
sheets.addEventListener("click",e=>{const b=e.target.closest(".nm");if(b)openReport(+b.dataset.c,b.dataset.id);
  const h=e.target.closest(".bh");if(h)openBeh(+h.dataset.c,h.dataset.i)});

/* ---------- behaviour picker ---------- */
let B=null;
function openBeh(c,id){B={c,id};const r=rec(c,id),s=S.students[c].find(x=>x.id===id);
  $("bhName").textContent=s.name;
  const all=[...S.settings.beh,...(r.beh||[]).filter(x=>!S.settings.beh.includes(x))];
  $("bhList").innerHTML=all.map((t,i)=>`<label class="chk"><input type="checkbox" id="bh${i}" value="${esc(t)}"${(r.beh||[]).includes(t)?" checked":""}><span>${esc(t)}</span></label>`).join("");
  $("bhOther").value=r.note||"";$("behPop").hidden=false;document.body.classList.add("ov")}
function closeBeh(){if(!B)return;const r=rec(B.c,B.id);
  r.beh=[...$("bhList").querySelectorAll("input:checked")].map(x=>x.value);r.note=$("bhOther").value.trim();saveRec(B.c,B.id);
  const {c,id}=B;$("behPop").hidden=true;document.body.classList.remove("ov");B=null;updateRow(c,id)}
$("bhDone").onclick=closeBeh;
$("bhClear").onclick=()=>{$("bhList").querySelectorAll("input").forEach(x=>x.checked=false);$("bhOther").value=""};
$("behPop").addEventListener("click",e=>{if(e.target.id==="behPop")closeBeh()});

  sumLine();
}
const sumLine=()=>$("sumLine").textContent="أعمال السنة "+toAr(maxOf("y"))+" + النهائي "+toAr(maxOf("f"))+" = "+toAr(totalMax())+" درجة";
$("settings").addEventListener("input",e=>{const t=e.target;
  if(t.id==="s_beh"){S.settings.beh=t.value.split("\n").map(x=>x.trim()).filter(Boolean);saveCfg();return}
  if(fields[t.id]){S.settings[fields[t.id]]=t.value;saveCfg();if(t.id!=="s_sc")render();return}
  if(t.dataset.x!==undefined){const ct=S.settings.cats[t.dataset.x],f=t.dataset.f;
    if(f==="label")ct.label=t.value;
    else if(f==="count")ct.count=+t.value;
    else{const v=parseFloat(toEn(t.value));if(!isNaN(v)&&v>0)ct.max=v}}
  saveCfg();sumLine();render();
});
$("s_term").addEventListener("change",e=>{S.settings.term=e.target.value;saveCfg();render()});
$("btnSettings").onclick=()=>toggle("settings","btnSettings",fillSettings);
$("btnClose").onclick=()=>toggle("settings","btnSettings",()=>{});
let clearArmed=false;
$("btnClear").onclick=async()=>{if(!clearArmed){clearArmed=true;$("clearConfirm").hidden=false;setTimeout(()=>{clearArmed=false;$("clearConfirm").hidden=true},4000);return}
  clearArmed=false;$("clearConfirm").hidden=true;
  const ids=Object.keys(S.data[cur]||{});S.data[cur]={};saveLocal();render();
  if(db)for(const id of ids){try{await db.doc(gPath(cur,id)).delete()}catch(e){}}};

/* students */
let delArmed=null;
function fillStudents(){
  $("stTitle").textContent="طلاب الفصل "+toAr(cur)+" ("+toAr(S.students[cur].length)+")";
  $("stList").innerHTML=S.students[cur].map((s,i)=>`<div class="strow">
    <span class="sn">${toAr(i+1)}</span>
    <input id="sn${cur}-${s.id}" data-id="${s.id}" value="${esc(s.name)}" aria-label="اسم الطالب ${toAr(i+1)}">
    <button class="btn del" type="button" data-del="${s.id}">${delArmed===s.id?"تأكيد الحذف":"حذف"}</button></div>`).join("");
}
$("btnStudents").onclick=()=>{delArmed=null;toggle("studentsBox","btnStudents",fillStudents)};
$("btnStClose").onclick=()=>toggle("studentsBox","btnStudents",()=>{});
$("stList").addEventListener("input",e=>{const t=e.target,s=S.students[cur].find(x=>x.id===t.dataset.id);if(!s)return;
  s.name=t.value;saveCfg();const b=document.querySelector(`.nm[data-c="${cur}"][data-id="${s.id}"]`);if(b)b.textContent=t.value});
$("stList").addEventListener("click",e=>{const b=e.target.closest("[data-del]");if(!b)return;const id=b.dataset.del;
  if(delArmed!==id){delArmed=id;fillStudents();setTimeout(()=>{if(delArmed===id){delArmed=null;fillStudents()}},4000);return}
  S.students[cur]=S.students[cur].filter(s=>s.id!==id);delArmed=null;saveCfg();delRec(cur,id);render();fillStudents()});
$("addForm").addEventListener("submit",e=>{e.preventDefault();const n=$("newName").value.trim();if(!n)return;
  S.students[cur].push({id:"n"+Date.now().toString(36),name:n});
  $("newName").value="";saveCfg();render();fillStudents();$("newName").focus()});
$("btnSort").onclick=()=>{S.students[cur].sort((a,b)=>a.name.localeCompare(b.name,"ar"));saveCfg();render();fillStudents()};

/* ---------- report / notice ---------- */
let R=null;
function waNum(p){let d=toEn(p||"").replace(/\D/g,"");if(!d)return"";if(d.startsWith("00"))d=d.slice(2);
  if(d.startsWith("05")&&d.length===10)d="966"+d.slice(1);else if(d.startsWith("5")&&d.length===9)d="966"+d;return d}
const SECX=[{k:"_y",label:"مجموع أعمال السنة"},{k:"_t",label:"المجموع الكلي"}];
const secOn=k=>!(S.settings.rOff||[]).includes(k);
function fillSecs(){$("rSecs").innerHTML=[...S.settings.cats,...SECX].map(ct=>`<label class="chk"><input type="checkbox" id="rs_${ct.k}" data-k="${ct.k}"${secOn(ct.k)?" checked":""}><span>${esc(ct.label)}</span></label>`).join("")}
$("rSecs").addEventListener("change",e=>{const k=e.target.dataset.k;let o=S.settings.rOff||[];
  o=e.target.checked?o.filter(x=>x!==k):[...o,k];S.settings.rOff=o;saveCfg();renderReport()});
function openReport(c,id){R={c,id};$("rTo").value="p";$("rMsg").value="";$("rStatus").textContent="";
  fillSecs();$("report").hidden=false;document.body.classList.add("ov");renderReport();$("rClose").focus()}
function renderReport(){if(!R)return;const {c,id}=R,s=S.students[c].find(x=>x.id===id);if(!s){closeReport();return}
  const r=rec(c,id),to=$("rTo").value,y=sumOf(c,id,"y"),all=sumOf(c,id);
  const rows=S.settings.cats.filter(ct=>secOn(ct.k)).map(ct=>{const vals=(r.s[ct.k]||[]).slice(0,ct.count);let t=0,n=0;
    const marks=[];for(let j=0;j<ct.count;j++){const v=vals[j];if(isNum(v)){t+=+v;n++;marks.push(toAr(v))}else marks.push("–")}
    return `<tr><td class="rl">${esc(ct.label)}</td><td>${marks.join(" ، ")}</td><td class="rv">${n?fmt(t):"–"}</td><td>${toAr(ct.count*ct.max)}</td></tr>`}).join("");
  const toTxt=to==="p"?"المكرم ولي أمر الطالب":"المكرم الموجه الطلابي";
  const subj=S.settings.subject;
  const body=to==="p"?`نفيدكم بمستوى ابنكم الدراسي في مادة ${esc(subj)} حسب الدرجات المرصودة حتى تاريخه، ونأمل منكم المتابعة والتعاون مع المدرسة.`
    :`نحيطكم علمًا بمستوى الطالب الدراسي في مادة ${esc(subj)} حسب الدرجات المرصودة حتى تاريخه، للاطلاع والمتابعة.`;
  const msg=$("rMsg").value.trim(),bl=behList(r);
  $("rDoc").innerHTML=`${headHTML(c)}
   <h1 class="title">إشعار بالمستوى الدراسي للطالب</h1>
   <div class="rto"><p><b>${toTxt}</b> &nbsp;&nbsp; حفظه الله</p><p>السلام عليكم ورحمة الله وبركاته، وبعد:</p><p>${body}</p></div>
   <div class="rname"><span>اسم الطالب:</span> <b>${esc(s.name)}</b></div>
   <div class="tbl-wrap"><table class="rt"><thead><tr><th>القسم</th><th>الدرجات</th><th>المجموع</th><th>من</th></tr></thead><tbody>${rows}
    ${secOn("_y")?`<tr class="rs"><td class="rl">مجموع أعمال السنة</td><td></td><td class="rv">${y.n?fmt(y.t):"–"}</td><td>${toAr(maxOf("y"))}</td></tr>`:""}
    ${secOn("_t")?`<tr class="rs"><td class="rl">المجموع الكلي</td><td></td><td class="rv">${all.n?fmt(all.t):"–"}</td><td>${toAr(totalMax())}</td></tr>`:""}</tbody></table></div>
   <div class="rnotes"><p><span>الملاحظات السلوكية:</span>${bl.length?"":" لا توجد"}</p>${bl.length?`<ul>${bl.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}${msg?`<p><span>ملاحظة المعلم:</span> ${esc(msg)}</p>`:""}</div>
   <p class="rend">وتقبلوا خالص التحية والتقدير،،،</p>
   <div class="rsig"><span>معلم المادة: ....................</span><span>التوقيع: ....................</span></div>`;
  const lines=[`${toTxt} حفظه الله`,`السلام عليكم ورحمة الله وبركاته`,
    (to==="p"?`نفيدكم بمستوى ابنكم *${s.name}*`:`نحيطكم علمًا بمستوى الطالب *${s.name}*`)+` في مادة ${subj} (الصف الثاني الابتدائي / ${toAr(c)}) حسب الدرجات المرصودة حتى تاريخه:`,""];
  S.settings.cats.filter(ct=>secOn(ct.k)).forEach(ct=>{const vals=(r.s[ct.k]||[]).slice(0,ct.count).filter(isNum);
    lines.push(`▫️ ${ct.label}: ${vals.length?fmt(vals.reduce((a,b)=>a+ +b,0)):"–"} من ${toAr(ct.count*ct.max)}`)});
  if(secOn("_y"))lines.push(`▫️ مجموع أعمال السنة: ${y.n?fmt(y.t):"–"} من ${toAr(maxOf("y"))}`);
  if(secOn("_t"))lines.push(`▫️ المجموع الكلي: ${all.n?fmt(all.t):"–"} من ${toAr(totalMax())}`);
  if(bl.length){lines.push("","*الملاحظات السلوكية:*");bl.forEach(x=>lines.push("• "+x))}
  if(msg)lines.push("",`ملاحظة المعلم: ${msg}`);
  lines.push("","معلم المادة — ابتدائية هشام بن عبدالملك");
  R.text=lines.join("\n");
  const n=waNum(S.settings.sc);$("rWa").href="https://wa.me/"+n+"?text="+encodeURIComponent(R.text);
  if(!n)$("rStatus").textContent="أضف جوال الموجه الطلابي من الإعدادات، وإلا سيُفتح واتساب لتختار جهة الاتصال.";
}
$("rTo").addEventListener("change",renderReport);
$("rMsg").addEventListener("input",renderReport);
function closeReport(){$("report").hidden=true;document.body.classList.remove("ov");R=null}
$("rClose").onclick=closeReport;
$("report").addEventListener("click",e=>{if(e.target.id==="report")closeReport()});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!$("behPop").hidden)closeBeh();else if(!$("report").hidden)closeReport()});
$("rCopy").onclick=()=>{const t=R&&R.text;if(!t)return;
  navigator.clipboard.writeText(t).then(()=>$("rStatus").textContent="نُسخ النص، الصقه في أي محادثة.")
   .catch(()=>$("rStatus").textContent="تعذّر النسخ التلقائي في هذا المتصفح.")};

/* ---------- printing: only the sheet or the notice, nothing else ---------- */
function fillPrint(kind){const pr=$("printRoot");
  if(kind==="report")pr.innerHTML=`<article class="rdoc">${$("rDoc").innerHTML}</article>`;
  else{const cs=$("printScope").value==="all"?[1,2]:[cur];
    pr.innerHTML=cs.map((c,i)=>sheetHTML(c,true).replace('<article class="sheet"',`<article class="sheet${i?" pb":""}"`)).join("")}}
function nativePrint(kind){fillPrint(kind);document.body.classList.add("printing");setTimeout(()=>window.print(),60)}
window.addEventListener("afterprint",()=>{document.body.classList.remove("printing");$("printRoot").innerHTML=""});
$("btnPrint").onclick=()=>nativePrint("sheet");
$("rPrint").onclick=()=>nativePrint("report");

let downloads=null;
function printDoc(kind){fillPrint(kind);const content=$("printRoot").innerHTML;$("printRoot").innerHTML="";
  const css=document.querySelector("style").textContent;
  const t=kind==="report"&&R?"إشعار "+S.students[R.c].find(x=>x.id===R.id).name:"كشف متابعة درجات الطلاب";
  return '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>'+esc(t)+'</title>'
   +'<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@700&display=swap">'
   +'<style>'+css+'\nhtml,body{margin:0;background:#fff}body{padding:0}.P{margin:0 auto}@media screen{body{padding:16px 8px}}</style></head><body><div class="P">'+content
   +'</div><script>addEventListener("load",function(){setTimeout(function(){window.print()},500)})<\/script></body></html>'}
async function savePrint(kind,btn){if(!downloads)return;
  const label=btn.textContent;btn.disabled=true;
  try{const s=R?S.students[R.c].find(x=>x.id===R.id):null;
    const name=kind==="report"&&s?`إشعار ${s.name}.html`:`كشف درجات الثاني ${$("printScope").value==="all"?"الفصلين":"الفصل "+toAr(cur)}.html`;
    await downloads.save({filename:name,data:printDoc(kind)});
    const m="نُزّل الملف. افتحه وستظهر نافذة الطباعة مباشرة.";if(kind==="report")$("rStatus").textContent=m;else setSync("ok",m)}
  catch(e){if(e&&e.code!=="declined"){const m="تعذّر تنزيل الملف، حاول مرة أخرى.";if(kind==="report")$("rStatus").textContent=m;else setSync("err",m)}}
  finally{btn.disabled=false;btn.textContent=label}}
$("btnPdf").onclick=()=>savePrint("sheet",$("btnPdf"));
$("rPdf").onclick=()=>savePrint("report",$("rPdf"));

const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
if(inFrame){$("btnPrint").hidden=true;$("rPrint").hidden=true}
(async()=>{if(!window.claude||!claude.use)return;
  try{downloads=await claude.use("downloads")}catch(e){}
  if(downloads){$("btnPdf").hidden=false;$("rPdf").hidden=false}
  else if(inFrame)$("printScope").hidden=true})();
if(inFrame&&!(window.claude&&claude.use))$("printScope").hidden=true;

render();
connect();
</script>

</body></html>
